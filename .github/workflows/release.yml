name: Release

run-name: Release v${{ inputs.version }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version from package.json to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Verify, publish, and release
    if: github.repository == 'kanchengw/dsh-assembly.resume' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Set up npm
        run: npm install --global npm@11.19.0

      - name: Validate release request
        id: package
        shell: bash
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          package_name="$(node -p "require('./package.json').name")"
          package_version="$(node -p "require('./package.json').version")"
          tag="v${package_version}"

          if [[ "$REQUESTED_VERSION" != "$package_version" ]]; then
            echo "Requested version $REQUESTED_VERSION does not match package.json version $package_version." >&2
            exit 1
          fi

          already_published=false
          if npm view "${package_name}@${package_version}" version >/dev/null 2>&1; then
            published_git_head="$(npm view "${package_name}@${package_version}" gitHead)"
            if [[ "$published_git_head" != "$GITHUB_SHA" ]]; then
              echo "${package_name}@${package_version} was published from ${published_git_head:-an unknown commit}, not $GITHUB_SHA." >&2
              exit 1
            fi
            already_published=true
            echo "${package_name}@${package_version} already matches this commit; only the GitHub release will be repaired."
          fi

          tag_sha="$(git ls-remote --tags origin "refs/tags/${tag}" | cut -f1)"
          if [[ -n "$tag_sha" && "$tag_sha" != "$GITHUB_SHA" ]]; then
            echo "Tag ${tag} points to ${tag_sha}, not $GITHUB_SHA." >&2
            exit 1
          fi

          echo "name=${package_name}" >> "$GITHUB_OUTPUT"
          echo "version=${package_version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "already_published=${already_published}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Verify package artifact
        run: pnpm test:artifact

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Inspect npm package contents
        run: npm pack --dry-run

      - name: Publish to npm
        if: steps.package.outputs.already_published != 'true'
        run: npm publish --provenance --access public

      - name: Create GitHub tag and release
        env:
          GH_TOKEN: ${{ github.token }}
          PACKAGE_NAME: ${{ steps.package.outputs.name }}
          TAG: ${{ steps.package.outputs.tag }}
        run: >-
          gh release create "$TAG"
          --target "$GITHUB_SHA"
          --title "$PACKAGE_NAME $TAG"
          --generate-notes
